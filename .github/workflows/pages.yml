name: Build and publish

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone OpenSHC
        run: git clone --quiet --single-branch --branch main https://github.com/sourcehold/OpenSHC.git openshc
      - name: Build the numbers
        run: python scripts/build_data.py --openshc openshc --out site/data --fetch-branches
      - name: Draw the preview image
        run: |
          python -m pip install --quiet matplotlib==3.9.2
          python scripts/make_card.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
